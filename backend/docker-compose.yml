services:
  mongodb:
    image: mongo:7
    container_name: harmonest-mongodb
    ports:
      - "27017:27017"
    volumes:
      - harmonest-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: harmonest-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: mongodb://mongodb:27017/harmonest
      JWT_SECRET: local-dev-secret-change-me-32chars-min
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      GUESTY_CLIENT_ID: ${GUESTY_CLIENT_ID:-}
      GUESTY_CLIENT_SECRET: ${GUESTY_CLIENT_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - harmonest-uploads:/app/data/uploads

volumes:
  harmonest-mongo-data:
  harmonest-uploads:
