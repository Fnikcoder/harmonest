# Harmonest backend — default profile.
# Override secrets via environment variables in Docker / production.

spring:
  application:
    name: harmonest-backend

  data:
    mongodb:
      # docker-compose sets MONGODB_URI; local dev can use localhost.
      uri: ${MONGODB_URI:mongodb://localhost:27017/harmonest}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

harmonest:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://www.harmonest.de,https://checkin.harmonest.de}

  security:
    jwt:
      # MUST be overridden in production (min 32 chars for HS256).
      secret: ${JWT_SECRET:change-me-in-production-use-at-least-32-characters}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

  guesty:
    # Guesty Open API (OAuth2 client credentials) — not GuestyForHosts.
    base-url: ${GUESTY_BASE_URL:https://open-api.guesty.com/v1}
    token-url: ${GUESTY_TOKEN_URL:https://open-api.guesty.com/oauth2/token}
    client-id: ${GUESTY_CLIENT_ID:}
    client-secret: ${GUESTY_CLIENT_SECRET:}
    # API paths will be finalized when you define the exact sync contract.
    listings-path: ${GUESTY_LISTINGS_PATH:/listings}
    reservations-path: ${GUESTY_RESERVATIONS_PATH:/reservations}

  storage:
    # Local path for dev; swap to S3-compatible implementation later.
    type: ${STORAGE_TYPE:local}
    local-base-path: ${STORAGE_LOCAL_PATH:./data/uploads}

  checkin:
    # Hours before arrival when access email may be sent (business rule TBD).
    notification-lead-hours: ${CHECKIN_NOTIFICATION_LEAD_HOURS:24}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    de.harmonest: DEBUG
    org.springframework.security: INFO
